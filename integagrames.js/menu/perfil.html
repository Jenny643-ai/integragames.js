<!DOCTYPE html>
<html lang="es">
<head>
    <%- include('../menu/php/encabezado') %>
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>

<div id="wrapper">

    <%- include('../menu/php/menuLateral') %>

    <div id="content-wrapper">
        <div id="content">

            <%- include('../menu/php/barraSuperior') %>

            <div class="container perfil-container">

                <h4>Perfil</h4>

                <div class="perfil-box">

                    <!-- FOTO -->
                    <div class="text-center">
                        <div class="foto-container">
                            <img src="<%= imagen %>" class="perfil-img">

                            <button class="btn btn-info btn-sm btn-foto"
                                data-toggle="modal"
                                data-target="#modalFoto">
                                <i class="fas fa-edit"></i>
                            </button>
                        </div>

                        <strong><%= user.nombre %></strong>
                    </div>

                    <!-- INFO -->
                    <div class="info-box">

                        <h5>Información</h5>

                        <div class="info-item">
                            <span>Correo</span>
                            <span><%= user.correo %></span>
                        </div>

                        <div class="info-item">
                            <span>Rol</span>
                            <span><%= rol %></span>
                        </div>

                        <div class="info-item">
                            <span>Contraseña</span>
                            <span>********</span>
                        </div>

                    </div>
                </div>

            </div>

        </div>
    </div>

</div>

</body>
</html>
