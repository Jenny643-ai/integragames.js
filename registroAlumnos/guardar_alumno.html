<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Participante</title>
</head>

<body>

<h2>Registro</h2>

<form id="formRegistro">
    <input type="text" id="nombre" placeholder="Nombre" required>
    <input type="number" id="edad" placeholder="Edad" required>

    <select id="id_evento" required>
        <option value="1">Evento 1</option>
    </select>

    <select id="id_escuela" required>
        <option value="1">Escuela 1</option>
    </select>

    <button type="submit">Registrarse</button>
</form>

<!--  ESTE ES TU JS -->
<script src="registro_participante.js"></script>

</body>
</html>
