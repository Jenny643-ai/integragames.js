<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Escuelas</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body class="container mt-4">

<h3>Gestión de Escuelas</h3>

<div class="d-flex mb-3">
    <input type="text" id="buscador" class="form-control me-2" placeholder="Buscar...">

    <select id="orden" class="form-control w-25">
        <option value="asc">A - Z</option>
        <option value="desc">Z - A</option>
    </select>

    <button class="btn btn-success ms-2" onclick="abrirModal()">+ Nueva</button>
</div>

<table class="table table-bordered text-center" id="tablaEscuelas">
    <thead>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Dirección</th>
            <th>Teléfono</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<!-- MODAL -->
<div class="modal fade" id="modal">
    <div class="modal-dialog">
        <div class="modal-content p-3">

            <input type="hidden" id="id">

            <input type="text" id="nombre" class="form-control mb-2" placeholder="Nombre">
            <textarea id="direccion" class="form-control mb-2" placeholder="Dirección"></textarea>
            <input type="text" id="telefono" class="form-control mb-2" placeholder="Teléfono">

            <button class="btn btn-primary" onclick="guardar()">Guardar</button>
        </div>
    </div>
</div>

<script src="/registroEscuela/escuelas.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
